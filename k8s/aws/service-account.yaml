# IAM Role for Service Account (IRSA) 설정
# AWS EKS에서 Pod가 AWS 리소스에 접근할 때 사용
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rest-server
  namespace: rest-server
  annotations:
    # IRSA: Pod에 IAM Role 연결
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/rest-server-eks-role
    # Audience (기본값)
    eks.amazonaws.com/audience: sts.amazonaws.com
    # Token expiration (기본 86400초 = 24시간)
    eks.amazonaws.com/token-expiration: "86400"

---
