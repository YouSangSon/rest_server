# AWS EBS Storage Classes
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3                    # GP3 SSD (최신, 가장 비용 효율적)
  iops: "3000"                 # IOPS
  throughput: "125"            # MB/s
  encrypted: "true"            # 암호화
  kmsKeyId: "arn:aws:kms:REGION:ACCOUNT_ID:key/KEY_ID"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete

---
# High Performance Storage Class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-io2
provisioner: ebs.csi.aws.com
parameters:
  type: io2                    # IO2 (매우 높은 성능)
  iops: "10000"
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain          # 삭제 시 볼륨 보존

---
# AWS EFS Storage Class (공유 파일 시스템)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap     # EFS Access Point
  fileSystemId: fs-xxxxxxxxx   # EFS 파일 시스템 ID
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/dynamic_provisioning"
mountOptions:
- tls                          # TLS 암호화
- iam                          # IAM 인증
volumeBindingMode: Immediate
reclaimPolicy: Delete

---
# PersistentVolumeClaim 예시 (로그 저장용)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rest-server-logs
  namespace: rest-server
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 20Gi              # 20GB

---
# Shared Storage PVC (EFS)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rest-server-shared
  namespace: rest-server
spec:
  accessModes:
  - ReadWriteMany              # 여러 Pod에서 동시 접근
  storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
