# External Secrets Operator를 사용한 AWS Secrets Manager 통합
# https://external-secrets.io/
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: rest-server
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2  # 서울 리전
      auth:
        jwt:
          serviceAccountRef:
            name: rest-server  # IRSA가 설정된 ServiceAccount

---
# External Secret - Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rest-server-db-secret
  namespace: rest-server
spec:
  refreshInterval: 1h  # 1시간마다 동기화
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: rest-server-db-credentials  # 생성될 K8s Secret 이름
    creationPolicy: Owner

  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: rest-server/db  # Secrets Manager의 secret 이름
      property: password    # JSON 키

  - secretKey: DB_USERNAME
    remoteRef:
      key: rest-server/db
      property: username

---
# External Secret - OAuth2 Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rest-server-oauth2-secret
  namespace: rest-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: rest-server-oauth2-credentials
    creationPolicy: Owner

  data:
  - secretKey: GOOGLE_CLIENT_ID
    remoteRef:
      key: rest-server/oauth2
      property: google_client_id

  - secretKey: GOOGLE_CLIENT_SECRET
    remoteRef:
      key: rest-server/oauth2
      property: google_client_secret

  - secretKey: NAVER_CLIENT_ID
    remoteRef:
      key: rest-server/oauth2
      property: naver_client_id

  - secretKey: NAVER_CLIENT_SECRET
    remoteRef:
      key: rest-server/oauth2
      property: naver_client_secret

  - secretKey: KAKAO_CLIENT_ID
    remoteRef:
      key: rest-server/oauth2
      property: kakao_client_id

  - secretKey: KAKAO_CLIENT_SECRET
    remoteRef:
      key: rest-server/oauth2
      property: kakao_client_secret

---
# External Secret - JWT Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rest-server-jwt-secret
  namespace: rest-server
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: rest-server-jwt
    creationPolicy: Owner

  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: rest-server/jwt
      property: secret_key

---
# AWS Secrets Manager에 저장할 Secret 예시 (AWS CLI)
#
# # DB Credentials
# aws secretsmanager create-secret \
#   --name rest-server/db \
#   --description "REST Server Database Credentials" \
#   --secret-string '{"username":"postgres","password":"your-secure-password"}' \
#   --region ap-northeast-2
#
# # OAuth2 Credentials
# aws secretsmanager create-secret \
#   --name rest-server/oauth2 \
#   --description "REST Server OAuth2 Credentials" \
#   --secret-string '{
#     "google_client_id":"xxx",
#     "google_client_secret":"xxx",
#     "naver_client_id":"xxx",
#     "naver_client_secret":"xxx",
#     "kakao_client_id":"xxx",
#     "kakao_client_secret":"xxx"
#   }' \
#   --region ap-northeast-2
#
# # JWT Secret
# aws secretsmanager create-secret \
#   --name rest-server/jwt \
#   --description "REST Server JWT Secret" \
#   --secret-string '{"secret_key":"your-256-bit-secret"}' \
#   --region ap-northeast-2
