apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rest-server-metrics
  namespace: rest-server
  labels:
    app: rest-server
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: rest-server

  endpoints:
  - port: actuator
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s

  namespaceSelector:
    matchNames:
    - rest-server

---
# Prometheus Rule (알람 설정)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rest-server-alerts
  namespace: rest-server
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: rest-server
    interval: 30s
    rules:
    # High Error Rate
    - alert: HighErrorRate
      expr: |
        sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (namespace, pod)
        /
        sum(rate(http_server_requests_seconds_count[5m])) by (namespace, pod)
        > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "Pod {{ $labels.pod }} has error rate > 5%"

    # High Response Time
    - alert: HighResponseTime
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_server_requests_seconds_bucket[5m])) by (le, namespace, pod)
        ) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High response time detected"
        description: "Pod {{ $labels.pod }} p95 response time > 1s"

    # High CPU Usage
    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{pod=~"rest-server-.*"}[5m])) by (pod)
        > 0.8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "Pod {{ $labels.pod }} CPU > 80%"

    # High Memory Usage
    - alert: HighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{pod=~"rest-server-.*"}) by (pod)
        /
        sum(container_spec_memory_limit_bytes{pod=~"rest-server-.*"}) by (pod)
        > 0.9
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High memory usage"
        description: "Pod {{ $labels.pod }} memory > 90%"

    # Pod Restart
    - alert: PodRestarting
      expr: |
        rate(kube_pod_container_status_restarts_total{pod=~"rest-server-.*"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod is restarting"
        description: "Pod {{ $labels.pod }} is restarting frequently"

    # Low Pod Count
    - alert: LowPodCount
      expr: |
        count(kube_pod_status_phase{pod=~"rest-server-.*", phase="Running"}) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Low pod count"
        description: "Less than 3 pods are running"
