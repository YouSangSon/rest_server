apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rest-server-pdb
  namespace: rest-server
spec:
  minAvailable: 2  # 최소 2개 포드는 항상 실행 중이어야 함
  selector:
    matchLabels:
      app: rest-server

  # 또는 maxUnavailable 사용
  # maxUnavailable: 1  # 최대 1개만 중단 가능

  # Unhealthy Pod Eviction Policy
  unhealthyPodEvictionPolicy: IfHealthyBudget

---
# Note: PodDisruptionBudget은 노드 유지보수, 클러스터 업그레이드 시
# 최소 가용 포드 수를 보장합니다.
