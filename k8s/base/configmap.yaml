apiVersion: v1
kind: ConfigMap
metadata:
  name: rest-server-config
  namespace: rest-server
data:
  # Application
  SPRING_PROFILES_ACTIVE: "prod"
  APP_PORT: "8080"

  # Database
  DB_URL: "jdbc:postgresql://postgresql:5432/rest_prod"
  DB_USERNAME: "postgres"
  DB_POOL_SIZE: "30"
  DB_MIN_IDLE: "10"
  DB_IDLE_TIMEOUT: "30000"
  DB_CONN_TIMEOUT: "10000"
  DB_MAX_LIFETIME: "2000000"

  # JPA
  JPA_SHOW_SQL: "false"
  JPA_DDL_AUTO: "validate"
  HIBERNATE_FORMAT_SQL: "false"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # MongoDB
  MONGODB_URI: "mongodb://mongodb:27017/rest_server"
  MONGODB_DATABASE: "rest_server"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "rest-server-group"

  # JWT
  JWT_EXPIRATION: "86400000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # CORS
  CORS_ALLOWED_ORIGINS: "https://yourdomain.com,https://www.yourdomain.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  CORS_ALLOWED_HEADERS: "*"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "3600"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: "100"

  # Logging
  LOG_LEVEL: "INFO"
  APP_LOG_LEVEL: "INFO"
  SPRING_LOG_LEVEL: "WARN"
  SECURITY_LOG_LEVEL: "INFO"
  WEB_LOG_LEVEL: "WARN"

  # Server
  COMPRESSION_ENABLED: "true"
  COMPRESSION_MIN_RESPONSE_SIZE: "1KB"

  # Swagger
  SWAGGER_API_DOCS_PATH: "/api-docs"
  SWAGGER_UI_PATH: "/swagger-ui.html"

  # Health
  REDIS_HEALTH_ENABLED: "true"
