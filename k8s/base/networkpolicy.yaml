apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rest-server-network-policy
  namespace: rest-server
spec:
  podSelector:
    matchLabels:
      app: rest-server

  policyTypes:
  - Ingress
  - Egress

  # Ingress Rules (들어오는 트래픽)
  ingress:
  # Ingress Controller로부터의 트래픽 허용
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080

  # 같은 네임스페이스 내 포드 간 통신 허용
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080

  # Prometheus/Monitoring 허용
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080

  # Egress Rules (나가는 트래픽)
  egress:
  # DNS 허용
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # PostgreSQL 허용
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432

  # Redis 허용
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

  # MongoDB 허용
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017

  # Kafka 허용
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092

  # External APIs (OAuth2, etc.) 허용
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
