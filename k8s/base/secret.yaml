apiVersion: v1
kind: Secret
metadata:
  name: rest-server-secret
  namespace: rest-server
type: Opaque
stringData:
  # Database Password
  DB_PASSWORD: "postgres"

  # Redis Password (if needed)
  REDIS_PASSWORD: ""

  # JWT Secret (256-bit)
  JWT_SECRET: "your-256-bit-secret-your-256-bit-secret-your-256-bit-secret-change-this-in-production"

  # OAuth2 Credentials - Google
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"

  # OAuth2 Credentials - Naver
  NAVER_CLIENT_ID: "your-naver-client-id"
  NAVER_CLIENT_SECRET: "your-naver-client-secret"

  # OAuth2 Credentials - Kakao
  KAKAO_CLIENT_ID: "your-kakao-client-id"
  KAKAO_CLIENT_SECRET: "your-kakao-client-secret"

---
# Note: In production, use Sealed Secrets or External Secrets Operator
# kubectl create secret generic rest-server-secret \
#   --from-literal=DB_PASSWORD='your-password' \
#   --from-literal=JWT_SECRET='your-jwt-secret' \
#   --namespace=rest-server
