apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest-server-hpa
  namespace: rest-server
  labels:
    app: rest-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest-server

  # 최소/최대 포드 수
  minReplicas: 3
  maxReplicas: 20

  # 스케일링 정책
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5분 안정화 후 스케일 다운
      policies:
      - type: Percent
        value: 50            # 최대 50%씩 감소
        periodSeconds: 60    # 1분마다
      - type: Pods
        value: 2             # 최대 2개씩 감소
        periodSeconds: 60
      selectPolicy: Min      # 더 보수적인 정책 선택
    scaleUp:
      stabilizationWindowSeconds: 0    # 즉시 스케일 업
      policies:
      - type: Percent
        value: 100           # 최대 100%씩 증가 (빠른 대응)
        periodSeconds: 15    # 15초마다
      - type: Pods
        value: 4             # 최대 4개씩 증가
        periodSeconds: 15
      selectPolicy: Max      # 더 공격적인 정책 선택

  # 메트릭 기반 스케일링
  metrics:
  # CPU 사용률 (Virtual Threads로 CPU 효율적)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # CPU 70% 이상 시 스케일 업

  # 메모리 사용률
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # 메모리 80% 이상 시 스케일 업

  # Custom Metrics (Prometheus Adapter 필요)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "1000"  # 포드당 1000 RPS 이상 시 스케일 업
