# PostgreSQL profile configuration
# Activate with: SPRING_PROFILES_ACTIVE=postgres (or --spring.profiles.active=postgres)

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/rest_server}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
# Optional: configure schema if needed
# spring.datasource.hikari.schema=public
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
