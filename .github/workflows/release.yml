name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          previous_tag=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            # First release - get all commits
            changelog=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            changelog=$(git log ${previous_tag}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Categorize commits
          features=$(echo "$changelog" | grep -i "^- feat" || echo "")
          fixes=$(echo "$changelog" | grep -i "^- fix" || echo "")
          docs=$(echo "$changelog" | grep -i "^- docs" || echo "")
          other=$(echo "$changelog" | grep -iv "^- feat\|^- fix\|^- docs" || echo "")

          # Build release notes
          release_notes="## What's Changed\n\n"

          if [ -n "$features" ]; then
            release_notes+="### ✨ Features\n$features\n\n"
          fi

          if [ -n "$fixes" ]; then
            release_notes+="### 🐛 Bug Fixes\n$fixes\n\n"
          fi

          if [ -n "$docs" ]; then
            release_notes+="### 📚 Documentation\n$docs\n\n"
          fi

          if [ -n "$other" ]; then
            release_notes+="### 🔧 Other Changes\n$other\n\n"
          fi

          # Save to file
          echo -e "$release_notes" > release_notes.md

      - name: Build release artifacts
        run: |
          # Build JAR
          ./gradlew clean bootJar --no-daemon

          # Create checksums
          cd build/libs
          for file in *.jar; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
            build/libs/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in files
        run: |
          version=${{ steps.version.outputs.version }}
          # Update version in build.gradle.kts, application.yml, etc.
          echo "Version $version released"

  publish-docker:
    name: Publish Release Docker Images
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            version=${{ github.event.inputs.version }}
          else
            version=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${version#v}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${version#v} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${version#v} | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rest-server:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/rest-server:${{ steps.version.outputs.major }}
            ${{ secrets.DOCKER_USERNAME }}/rest-server:${{ steps.version.outputs.minor }}
            ${{ secrets.DOCKER_USERNAME }}/rest-server:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, publish-docker]

    steps:
      - name: Send release notification
        run: |
          echo "🎉 New release published!"
          # Add your notification logic here (Slack, Discord, Email, etc.)
